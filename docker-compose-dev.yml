services:
  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    profiles:
      - app
    volumes:
      - .:/workspace/gargoyle
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      PREFIX: ','
      MONGO_URI: ${MONGO_URI}
      DEBUG_LEVEL: 6
      LOG_TO_FILE: false
    ports:
      - 3001:3001
    networks:
      - gargoyle

  mongo:
    hostname: mongo
    image: mongo:latest
    expose: [27017]
    profiles:
      - aux
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DBUSERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DBPASSWORD}
    volumes:
      - ./container/db:/data/db
      - ./container/configdb:/data/configdb
    networks:
      - gargoyle

networks:
  gargoyle:
    driver: bridge
