services:
  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    profiles:
      - app
    volumes:
      - .:/workspace/gargoyle
      - /tmp/gargoyle:/tmp
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      PREFIX: ','
      STEAM_API: ${STEAM_API}
      SUGGESTION_CHANNEL_ID: ${SUGGESTION_CHANNEL_ID}
      CERSH_API_KEY: ${CERSH_API_KEY}
      DEBUG_LEVEL: 6
      LOG_TO_FILE: false
      PROXMOX_NOTIFY_AUTH: ${PROXMOX_NOTIFY_AUTH}
      PROXMOX_NOTIFY_CHANNEL_ID: ${PROXMOX_NOTIFY_CHANNEL_ID}
      BGN_STAFF_DB_HOST: ${BGN_STAFF_DB_HOST}
      BGN_STAFF_DB_USER: ${BGN_STAFF_DB_USER}
      BGN_STAFF_DB_PASS: ${BGN_STAFF_DB_PASS}
      BGN_STAFF_DB_NAME: ${BGN_STAFF_DB_NAME}
      BGN_ADMIN_DB_USER: ${BGN_ADMIN_DB_USER}
      BGN_ADMIN_DB_PASS: ${BGN_ADMIN_DB_PASS}
      BGN_API_KEY: ${BGN_API_KEY}
      EXTERNAL_MODULES: ${EXTERNAL_MODULES}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      PG_HOST: postgres
      FOURTH_INSTANCE: ${FOURTH_INSTANCE}
      FOURTH_USER: ${FOURTH_USER}
      FOURTH_PASS: ${FOURTH_PASS}
      CHATTO_INSTANCE: ${CHATTO_INSTANCE}
      CHATTO_USER: ${CHATTO_USER}
      CHATTO_PASS: ${CHATTO_PASS}
    ports:
      - 3001:3001
    networks:
      - gargoyle

  postgres:
    hostname: postgres
    image: postgres:19
    ports:
      - 5432:5432
    profiles:
      - aux
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - gargoyle

networks:
  gargoyle:
    driver: bridge

volumes:
  postgres: